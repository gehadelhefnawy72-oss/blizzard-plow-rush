<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snow Plow Empire: 150 Cities</title>
<style>
:root{--navy:#0a1626;--ice:#d6ecff;--or:#ff8a1f;--yl:#ffd23f;--cy:#56d8ff;--glass:rgba(10,22,38,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1626;color:var(--ice);font-family:'Trebuchet MS','Segoe UI',Tahoma,Arial,sans-serif;touch-action:none}
canvas#c{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud *{pointer-events:none}
#hud button,#hud #joyzone{pointer-events:auto}
.chip{background:var(--glass);border:2px solid rgba(214,236,255,.25);border-radius:14px;padding:6px 12px;backdrop-filter:blur(4px)}
#tl{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:5px;width:min(210px,46vw)}
#money{width:fit-content}
#money{font:900 24px Impact,'Arial Black',sans-serif;color:var(--yl);letter-spacing:.5px;display:flex;gap:6px;align-items:center;transition:transform .12s}
#money.pop{transform:scale(1.12)}
#money b{color:var(--or)}
#cityname{font-size:13px;font-weight:700;line-height:1.25}
#cityname small{display:block;opacity:.7;font-weight:400}
.bar{position:relative;height:18px;border-radius:9px;background:rgba(0,0,0,.45);border:2px solid rgba(214,236,255,.3);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;transition:width .15s}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:800;line-height:14px;text-shadow:0 1px 2px #000}
#prog i{background:linear-gradient(90deg,#3fa9ff,#8fe3ff)}
#tr{position:absolute;right:10px;top:10px;display:flex;gap:8px}
#tr button{pointer-events:auto;min-width:46px;height:46px;border-radius:14px;border:2px solid rgba(214,236,255,.3);background:var(--glass);color:var(--ice);font:800 14px inherit;font-family:inherit;padding:0 12px}
#tr button.main{background:linear-gradient(#ffa63f,#ff7a12);color:#2a1300;border-color:#ffd9a8}
#tr button:active{transform:scale(.95)}
#bars{display:flex;flex-direction:column;gap:4px}
#bars .bar{height:16px}
#bars .bar span{line-height:12px;font-size:10px}
.tank i{background:linear-gradient(90deg,#e8f3ff,#9fd0ff)}
.tank.full i{background:linear-gradient(90deg,#ff6a3d,#ffb23f);animation:fl .4s infinite alternate}
.nit i{background:linear-gradient(90deg,#2d7bff,#6ff2ff)}
@keyframes fl{to{filter:brightness(1.5)}}
#chestbox{position:absolute;right:8px;top:54px;font:900 13px Impact,'Arial Black',sans-serif;color:#2a1b00;background:linear-gradient(#ffe27a,#ffb41f);border-radius:12px;padding:6px 14px;display:none;box-shadow:0 0 18px #ffc83a}
#banner{position:absolute;left:50%;top:22%;transform:translate(-50%,0);font:900 clamp(22px,5vw,44px) Impact,'Arial Black',sans-serif;text-align:center;color:#fff;text-shadow:0 3px 0 #0a1626,0 0 22px var(--cy);opacity:0;white-space:normal;width:max-content;max-width:90vw;line-height:1.1}
#banner.show{animation:bn 2.4s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,16px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
#combo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:900 clamp(26px,7vw,60px) Impact,'Arial Black',sans-serif;color:var(--yl);text-shadow:0 4px 0 #b34a00,0 0 26px #ff8a1f;opacity:0;white-space:nowrap;text-align:center}
#combo.show{animation:cb 1.5s ease-out forwards}
@keyframes cb{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}28%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-weight:800;font-size:12px;max-width:calc(100vw - 210px);background:var(--glass);border-radius:12px;padding:6px 14px;display:none;text-align:center;max-width:80vw}
#joyzone{position:absolute;left:0;top:14%;width:55%;bottom:0}
#jbase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(214,236,255,.45);background:rgba(214,236,255,.1);display:none}
#jknob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(#fff,#9ccfff);box-shadow:0 0 14px #56d8ff}
#bNitro{position:absolute;right:16px;bottom:16px;width:96px;height:96px;border-radius:50%;border:4px solid #bfe9ff;background:radial-gradient(circle at 35% 30%,#7fe8ff,#1c6bff 70%);color:#fff;font:900 17px Impact,'Arial Black',sans-serif;box-shadow:0 0 22px #3aa9ff;touch-action:none}
#bNitro.on{filter:brightness(1.5);transform:scale(.94)}
#bFreeze{position:absolute;right:26px;bottom:128px;width:66px;height:66px;border-radius:50%;border:3px solid #e6f7ff;background:radial-gradient(circle at 35% 30%,#fff,#7fc8ff 75%);color:#073a66;font:900 24px inherit;display:none;touch-action:none}
#bFreeze:disabled{filter:grayscale(.8) brightness(.6)}
#bFreeze small{display:block;font-size:10px;line-height:10px}
.modal{position:fixed;inset:0;background:rgba(4,10,20,.78);display:none;align-items:center;justify-content:center;z-index:5;padding:10px;touch-action:pan-y}
.modal.open{display:flex}
.panel{background:linear-gradient(#13263d,#0b1828);border:3px solid #3d6a94;border-radius:20px;max-width:760px;width:100%;max-height:calc(var(--vh,1vh)*94);overflow:auto;padding:16px 18px;position:relative;box-shadow:0 0 0 4px #091321,0 20px 60px #000}
.panel h2{margin:0 0 6px;font:900 28px Impact,'Arial Black',sans-serif;color:var(--yl);letter-spacing:.5px}
.panel .x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:12px;border:2px solid #3d6a94;background:#0b1828;color:var(--ice);font-size:20px;font-weight:900}
.panel[dir=rtl] .x{right:auto;left:12px}
.m2{font:900 22px Impact,'Arial Black',sans-serif;color:var(--or);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.card{display:flex;gap:10px;align-items:center;background:rgba(214,236,255,.07);border:2px solid rgba(214,236,255,.14);border-radius:14px;padding:8px 10px}
.card .ic{font-size:28px;width:42px;text-align:center}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:14px}
.card small{display:block;font-size:11px;opacity:.75;line-height:1.25;margin:1px 0 4px}
.pips{display:flex;gap:3px}
.pips u{width:100%;min-width:2px;max-width:12px;height:6px;border-radius:3px;background:#2c4560}
.pips u.on{background:var(--cy)}
.pips u.xp{background:#3a2f55}
.pips u.xp.on{background:linear-gradient(90deg,#ffd23f,#ff4fd8);box-shadow:0 0 6px rgba(255,120,220,.7)}
.card.ex{border-color:rgba(255,210,63,.7);box-shadow:0 0 14px rgba(255,120,220,.25)}
.card button,.mis button,.btn{border:0;border-radius:12px;background:linear-gradient(#ffa63f,#ff7a12);color:#2a1300;font:900 14px inherit;font-family:inherit;padding:10px 14px;min-width:84px;box-shadow:0 3px 0 #a14a00}
.card button:disabled,.mis button:disabled,.btn:disabled{background:#33465c;color:#8fa6bd;box-shadow:none}
.btn:active,.card button:active,.mis button:active{transform:translateY(2px)}
.btn.alt{background:linear-gradient(#5aa9e6,#2f78b8);color:#fff;box-shadow:0 3px 0 #1b4a75}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cb{border:2px solid rgba(214,236,255,.2);background:rgba(214,236,255,.08);color:var(--ice);border-radius:12px;padding:8px 6px;text-align:center;font-family:inherit;font-size:12px;font-weight:700}
.cb b{display:block;font:900 18px Impact,sans-serif;color:var(--cy)}
.cb small{display:block;opacity:.7;font-size:10px}
.cb.cur{border-color:var(--yl);background:rgba(255,210,63,.15)}
.cb.lock{opacity:.4}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(214,236,255,.12);font-weight:700}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
@media (max-width:640px){#tr{right:6px;top:8px;gap:4px}#tr button{min-width:36px;height:36px;padding:0 6px;font-size:15px;border-radius:11px}#money{font-size:20px;padding:4px 10px}#cityname{font-size:11px;padding:4px 9px}#bNitro{width:76px;height:76px;right:12px;bottom:14px;font-size:14px}#bFreeze{right:21px;bottom:100px;width:54px;height:54px}}
@media (max-height:520px){#bNitro{width:80px;height:80px;bottom:10px}#bFreeze{bottom:100px;width:56px;height:56px}#bars{bottom:6px}.panel{padding:10px 14px}}
#tr button{position:relative}
#bossbox{display:none;width:fit-content;font:900 14px Impact,'Arial Black',sans-serif;color:#ffd6d6;border-color:rgba(255,90,90,.65);background:rgba(70,8,18,.82)}
#bossbox.warn{animation:fl .4s infinite alternate;color:#fff}
#buffbox{position:absolute;right:8px;top:92px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#buffbox div{font:900 12px Impact,'Arial Black',sans-serif;border-radius:10px;padding:4px 10px;color:#06223a;background:linear-gradient(#9ff0ff,#4cc3ff);box-shadow:0 0 14px #56d8ff}
#buffbox div.sp{color:#2a1b00;background:linear-gradient(#ffe27a,#ffb41f);box-shadow:0 0 14px #ffc83a}
#bDaily.dot::after{content:'';position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff3b3b;border:2px solid #fff;animation:fl .5s infinite alternate}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 10px}
.day{text-align:center;border:2px solid rgba(214,236,255,.2);background:rgba(214,236,255,.07);border-radius:12px;padding:6px 2px;font-size:11px;font-weight:700}
.day b{display:block;font:900 18px Impact,sans-serif;color:var(--cy)}
.day .ic2{font-size:20px;display:block;margin:2px 0}
.day.cur{border-color:var(--yl);background:rgba(255,210,63,.18)}
.day.past{opacity:.5}
.mis{display:flex;gap:10px;align-items:center;background:rgba(214,236,255,.07);border:2px solid rgba(214,236,255,.14);border-radius:14px;padding:8px 10px;margin-top:8px}
.mis .tx{flex:1;min-width:0}
.mis b{display:block;font-size:14px;margin-bottom:4px}
.mis .bar{height:14px}
.mis .bar i{background:linear-gradient(90deg,#ffb41f,#ffe27a)}
.mis .bar span{line-height:10px;font-size:10px}
.dmsg{background:rgba(255,210,63,.15);border:2px solid var(--yl);border-radius:12px;padding:8px 12px;font-weight:800;color:var(--yl);margin:6px 0}

#tr #bTrophy{font-size:22px;background:linear-gradient(#ffe27a,#ffb41f);color:#3a2500;border-color:#fff2b8;box-shadow:0 0 14px #ffc83a,0 0 28px rgba(255,200,58,.55);animation:tg 1.8s ease-in-out infinite}
@keyframes tg{50%{box-shadow:0 0 22px #ffd95a,0 0 44px rgba(255,200,58,.9);transform:scale(1.07)}}
#tr #bTrophy.alert{animation:tg .6s ease-in-out infinite}
#tr #bTrophy.alert::after{content:'!';position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#ff3b3b;color:#fff;border:2px solid #fff;font:900 12px/14px Arial,sans-serif;text-align:center}
#pTour{border-color:#d4a62a;background:linear-gradient(#2a2108,#120d03 75%);box-shadow:0 0 0 4px #1a1304,0 0 40px rgba(255,190,40,.35),0 20px 60px #000;max-width:560px}
#pTour .tH{color:#ffd23f;text-shadow:0 0 18px rgba(255,200,58,.6);font-size:24px;padding-right:44px}
.tsub{font-size:14px;opacity:.85;color:#ffe9a8;margin-bottom:6px}
.tme{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 4px;font-weight:800;font-size:14px}
.tme b{color:#ffd23f}
.tname{display:flex;gap:8px;margin:8px 0 2px}
.tname input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:2px solid #d4a62a;background:#0b0b0b;color:#fff;font:700 16px 'Trebuchet MS',Arial,sans-serif;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.terr{color:#ff8a8a;font-weight:800;min-height:18px;font-size:13px;margin-bottom:4px}
.trw{display:grid;grid-template-columns:44px 1fr 46px 66px 36px;gap:6px;align-items:center;padding:7px 10px;margin-top:6px;border-radius:12px;background:rgba(255,220,120,.07);border:2px solid rgba(255,210,100,.16);font-weight:800;font-size:13px}
.trw>span:nth-child(n+3){text-align:center}
.trw.hd{background:none;border:0;opacity:.7;font-size:11px;margin-top:2px;padding-top:0;padding-bottom:0}
.trw.emp{opacity:.4}
.trw .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trw .bc{display:flex;justify-content:center}
.trw .rk{font:900 18px Impact,sans-serif;color:#9fb6cc}
.trw.r1{font-size:15px;background:linear-gradient(90deg,rgba(255,210,63,.38),rgba(255,150,20,.16));border-color:#ffd23f;animation:r1g 1.8s ease-in-out infinite}
@keyframes r1g{50%{box-shadow:0 0 26px rgba(255,210,63,.8),inset 0 0 18px rgba(255,235,150,.35)}}
.trw.r2{border-color:#cfd8e3;background:linear-gradient(90deg,rgba(207,216,227,.2),rgba(207,216,227,.05))}
.trw.r3{border-color:#c8803c;background:linear-gradient(90deg,rgba(200,128,60,.24),rgba(200,128,60,.05))}
.trw.me{outline:2px solid #6ff2ff;outline-offset:1px;animation:meg 1.4s ease-in-out infinite}
@keyframes meg{50%{box-shadow:0 0 22px rgba(111,242,255,.85),inset 0 0 14px rgba(111,242,255,.35)}}
.crown{font-size:28px;line-height:1;display:inline-block;animation:crw 1.4s ease-in-out infinite;filter:drop-shadow(0 0 8px #ffd23f)}
@keyframes crw{50%{transform:translateY(-3px) rotate(-7deg) scale(1.12)}}
.bdg{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.bdg.sv{background:radial-gradient(#fff,#b9c4d0);box-shadow:0 0 10px #cfd8e3}
.bdg.bz{background:radial-gradient(#ffd0a0,#b86a2d);box-shadow:0 0 10px #c8803c}
.tfoot{margin-top:10px;font-weight:800;color:#ffe9a8;text-align:center}
.tfoot.sm{font-size:11px;opacity:.7;font-weight:700;margin-top:6px}
@media (max-width:640px){.trw{grid-template-columns:38px 1fr 38px 56px 30px;padding:6px 7px;gap:4px;font-size:12px}}
.pinl{font-weight:800;font-size:12px;opacity:.75;margin:10px 0 4px}
.cgrid.pin{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pinb{border-color:var(--yl);box-shadow:0 0 14px rgba(255,210,63,.45)}
#rot,#oriPick{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,14,26,.97);color:var(--ice);text-align:center;padding:16px;touch-action:none}
#rot.on,#oriPick.on{display:flex}
#oriPick{z-index:70}
#rot .ph{font-size:60px;display:inline-block;animation:rotph 1.8s ease-in-out infinite}
#rot b,#oriPick b.t{font:900 26px Impact,'Arial Black',sans-serif;color:var(--yl);letter-spacing:.5px}
#rot span,#oriPick span.s{opacity:.8;font-size:14px}
.opw{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.opb{pointer-events:auto;width:170px;max-width:42vw;padding:14px 8px;border-radius:18px;border:3px solid #3d6a94;background:linear-gradient(#17304d,#0c1b2e);color:var(--ice);font:800 17px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px}
.opb:active{transform:scale(.96)}
.opb .ic{display:block;border:4px solid var(--cy);border-radius:7px;background:rgba(86,216,255,.12)}
.opb.l .ic{width:68px;height:40px}.opb.p .ic{width:40px;height:68px}
.opb.on{border-color:var(--yl);box-shadow:0 0 16px rgba(255,210,63,.55)}
#rotGo{pointer-events:auto;margin-top:6px;padding:10px 18px;border-radius:14px;border:2px solid #3d6a94;background:#0c1b2e;color:var(--ice);font:700 14px inherit;font-family:inherit}
@keyframes rotph{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (max-height:360px){#oriPick{gap:8px}#oriPick b.t{font-size:20px}.opb{padding:8px}.opb.l .ic{width:52px;height:30px}.opb.p .ic{width:30px;height:52px}}
</style>
</head>
<body>
<div id="rot"><div class="ph">📱</div><b id="rotT"></b><span id="rotS"></span><button id="rotGo"></button></div>
<div id="oriPick"><b class="t" id="opT"></b><span class="s" id="opS"></span><div class="opw"><button class="opb l" id="opL"><i class="ic"></i><span id="opLt"></span></button><button class="opb p" id="opP"><i class="ic"></i><span id="opPt"></span></button></div></div>
<canvas id="c"></canvas>
<div id="hud">
  <div id="tl">
    <div id="money" class="chip"><b>$</b><span id="mv">0</span></div>
    <div class="chip" id="cityname"></div>
    <div class="chip" id="bossbox"></div>
    <div class="bar" id="prog"><i></i><span id="pt"></span></div>
    <div id="bars">
      <div class="bar tank" id="tankbar"><i></i><span></span></div>
      <div class="bar nit" id="nitbar"><i></i><span></span></div>
    </div>
  </div>
  <div id="tr">
    <button id="bTrophy" title="TOP 10">🏆</button>
    <button id="bShop" class="main"></button>

    <button id="bOri" title="Screen">⟲</button>

  <div id="chestbox"></div>
  <div id="buffbox"></div>
  <div id="banner"></div>

  <div id="joyzone"><div id="jbase"><div id="jknob"></div></div></div>

</div>
<div class="modal" id="mShop"><div class="panel" id="pShop"></div></div>
<div class="modal" id="mCity"><div class="panel" id="pCity"></div></div>
<div class="modal" id="mDone"><div class="panel" id="pDone"></div></div>
<div class="modal" id="mTour"><div class="panel" id="pTour"></div></div>
<div class="modal" id="mDaily"><div class="panel" id="pDaily"></div></div>

<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=Math.random, PI=Math.PI, TAU=PI*2;
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const angDiff=(a,b)=>{let d=b-a;while(d>PI)d-=TAU;while(d<-PI)d+=TAU;return d};
const fmt=n=>{n=Math.floor(n);if(n>=1e12)return(n/1e12).toFixed(2)+'T';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e4)return(n/1e3).toFixed(1)+'K';return String(n)};
const rr=(g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};

/* ================= world constants ================= */
const CS=12,TS=252;let WW=1800,WH=1200,GX=WW/CS,GY=WH/CS,NX=3,NY=3; /* world grows with the city: see setWorld() */
const isRoad=(x,y)=>x>=0&&y>=0&&x<WW&&y<WH&&((x%600)<190||(y%400)<190);
const BLK=[];function mkBlocks(){BLK.length=0;for(let j=0;j<NY;j++)for(let i=0;i<NX;i++)BLK.push({x:i*600+190,y:j*400+190,w:410,h:210})}mkBlocks();
const MEL={x:695,y:495,r:104};

/* ================= data ================= */

 else if(mode===1){sa=Math.min(1,sa*1.3+.05);l=Math.min(.75,l+.02)}

 return `hsl(${h|0},${(sa*100)|0}%,${(l*100)|0}%)`;
}
